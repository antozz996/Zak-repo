openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Zak Ecosystem AI - CRM Omnicanale API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Staff authentication and authorization
  - name: utenti
    description: Staff users
  - name: contatti
    description: CRM contacts and leads
  - name: preventivi
    description: Event quotes
  - name: events
    description: Operational event management built on top of quotes
  - name: agenda
    description: Personal agenda
  - name: task
    description: Personal tasks separated from calendar events
  - name: chat
    description: Unified chat messages
  - name: dashboard
    description: Dashboard summaries and analytics
  - name: reports
    description: Economic reporting and margin analysis
  - name: calendar
    description: Calendar availability and Google Calendar synchronization
  - name: webhooks
    description: External webhook receivers
  - name: automazioni
    description: CRM automation jobs and configuration
  - name: audit
    description: Staff action audit log
  - name: production
    description: Production readiness and go-live checks

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── UTENTI ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate a staff user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End current client session
      responses:
        "200":
          description: Session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated staff user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Missing or invalid session

  /auth/bootstrap-admin:
    post:
      operationId: bootstrapAdmin
      tags: [auth]
      summary: Create or secure the first admin account
      description: Creates the first admin when no users exist, or sets password for an existing admin when guarded by ZAK_BOOTSTRAP_ADMIN_TOKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapAdminInput"
      responses:
        "201":
          description: Bootstrap admin ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "403":
          description: Bootstrap not allowed

  /utenti:
    get:
      operationId: listUtenti
      tags: [utenti]
      summary: List all staff users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Utente"
    post:
      operationId: createUtente
      tags: [utenti]
      summary: Create a staff user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtenteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"

  /utenti/{id}:
    get:
      operationId: getUtente
      tags: [utenti]
      summary: Get a staff user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
    patch:
      operationId: updateUtente
      tags: [utenti]
      summary: Update a staff user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UtenteUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
    delete:
      operationId: deleteUtente
      tags: [utenti]
      summary: Delete a staff user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /preventivi/{id}/versioni:
    get:
      operationId: listPreventivoVersioni
      tags: [preventivi]
      summary: List quote versions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PreventivoVersione"
    post:
      operationId: createPreventivoVersione
      tags: [preventivi]
      summary: Create a quote version snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreventivoVersioneInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreventivoVersione"
        "404":
          description: Quote not found

  /preventivi/{id}/invia-whatsapp:
    post:
      operationId: sendPreventivoWhatsApp
      tags: [preventivi]
      summary: Send quote summary to the contact via WhatsApp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreventivoWhatsAppSendResult"
        "404":
          description: Quote not found

  /preventivi/{id}/pdf:
    get:
      operationId: downloadPreventivoPdf
      tags: [preventivi]
      summary: Download an event quote PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Quote not found

  /preventivi/{id}/conferma-digitale:
    post:
      operationId: confirmPreventivoDigitale
      tags: [preventivi]
      summary: Digitally confirm an event quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreventivoConfermaDigitaleInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreventivoConfermaDigitaleResult"
        "404":
          description: Quote not found
        "409":
          description: Requested event date is already confirmed for another quote

  # ── CONTATTI CRM ─────────────────────────────────────────────────────────────
  /contatti:
    get:
      operationId: listContatti
      tags: [contatti]
      summary: List CRM contacts
      parameters:
        - name: stato_lead
          in: query
          schema:
            type: string
        - name: tipo_evento
          in: query
          schema:
            type: string
        - name: origine_lead
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contatto"
    post:
      operationId: createContatto
      tags: [contatti]
      summary: Create a CRM contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContattoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contatto"
        "409":
          description: Contact already exists with the same normalized phone or Instagram username

  /contatti/{id}:
    get:
      operationId: getContatto
      tags: [contatti]
      summary: Get a CRM contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contatto"
    patch:
      operationId: updateContatto
      tags: [contatti]
      summary: Update a CRM contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContattoUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contatto"
        "409":
          description: Contact already exists with the same normalized phone or Instagram username
    delete:
      operationId: deleteContatto
      tags: [contatti]
      summary: Delete a CRM contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /contatti/import-csv:
    post:
      operationId: importContattiCsv
      tags: [contatti]
      summary: Import CRM contacts from CSV text with phone/social deduplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportContattiCsvInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportContattiCsvResult"

  /contatti/{id}/messaggi:
    get:
      operationId: getContattoMessaggi
      tags: [contatti]
      summary: Get chat messages for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Messaggio"

  /contatti/{id}/storico-stato:
    get:
      operationId: getContattoStoricoStato
      tags: [contatti]
      summary: Get lead status history for a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatoLeadStoricoItem"

  /messaggi/{id}/read:
    patch:
      operationId: markMessaggioRead
      tags: [chat]
      summary: Mark a message as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Messaggio"

  # ── PREVENTIVI EVENTI ────────────────────────────────────────────────────────
  /preventivi:
    get:
      operationId: listPreventivi
      tags: [preventivi]
      summary: List event quotes
      parameters:
        - name: stato_evento
          in: query
          schema:
            type: string
        - name: contatto_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Preventivo"
    post:
      operationId: createPreventivo
      tags: [preventivi]
      summary: Create an event quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreventivoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preventivo"
        "409":
          description: Requested event date is already confirmed for another quote

  /preventivi/calcola-prezzo:
    post:
      operationId: calculatePreventivoPricing
      tags: [preventivi]
      summary: Calculate quote pricing from package, guests and extras
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreventivoPricingInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreventivoPricingResult"
        "400":
          description: Invalid pricing request

  /preventivi/calcola-food-cost:
    post:
      operationId: calculatePreventivoFoodCost
      tags: [preventivi]
      summary: Calculate event food cost, incidence and margin from guests and budget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreventivoFoodCostInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreventivoFoodCostResult"
        "400":
          description: Invalid food cost request

  /preventivi/{id}:
    get:
      operationId: getPreventivo
      tags: [preventivi]
      summary: Get an event quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preventivo"
    patch:
      operationId: updatePreventivo
      tags: [preventivi]
      summary: Update an event quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreventivoUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preventivo"
        "409":
          description: Requested event date is already confirmed for another quote
    delete:
      operationId: deletePreventivo
      tags: [preventivi]
      summary: Delete an event quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /events/{id}:
    get:
      operationId: getEventDetail
      tags: [events]
      summary: Get full operational event detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          description: Event not found

  /events/{id}/status:
    patch:
      operationId: updateEventStatus
      tags: [events]
      summary: Update operational event stage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventStatusUpdateInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "400":
          description: Invalid transition
        "403":
          description: Insufficient permissions for override
        "404":
          description: Event not found

  /events/{id}/payments:
    get:
      operationId: listEventPayments
      tags: [events]
      summary: List event payment schedule rows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventPayment"
    post:
      operationId: createEventPayment
      tags: [events]
      summary: Create a payment schedule row for an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPayment"
        "404":
          description: Event not found

  /events/{id}/payments/{paymentId}:
    patch:
      operationId: updateEventPayment
      tags: [events]
      summary: Update a payment schedule row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPaymentUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPayment"
        "404":
          description: Payment not found
    delete:
      operationId: deleteEventPayment
      tags: [events]
      summary: Delete a payment schedule row
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /events/{id}/staff:
    get:
      operationId: listEventStaffAllocation
      tags: [events]
      summary: List event staff allocations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventStaffAllocation"
    post:
      operationId: createEventStaffAllocation
      tags: [events]
      summary: Create an event staff allocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventStaffAllocationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStaffAllocation"
        "404":
          description: Event not found
        "409":
          description: Duplicate allocation

  /events/{id}/staff/{allocationId}:
    patch:
      operationId: updateEventStaffAllocation
      tags: [events]
      summary: Update an event staff allocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: allocationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventStaffAllocationUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStaffAllocation"
        "404":
          description: Allocation not found
        "409":
          description: Duplicate allocation
    delete:
      operationId: deleteEventStaffAllocation
      tags: [events]
      summary: Delete an event staff allocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: allocationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── AGENDA PERSONALE ─────────────────────────────────────────────────────────
  /agenda:
    get:
      operationId: listAgenda
      tags: [agenda]
      summary: List personal agenda items
      parameters:
        - name: categoria
          in: query
          schema:
            type: string
        - name: data_da
          in: query
          schema:
            type: string
        - name: data_a
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaItem"
    post:
      operationId: createAgendaItem
      tags: [agenda]
      summary: Create an agenda item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaItem"

  /agenda/import-numbers-csv:
    post:
      operationId: importAgendaNumbersCsv
      tags: [agenda]
      summary: Import agenda events from an Apple Numbers monthly planner CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportAgendaNumbersCsvInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAgendaNumbersCsvResult"

  /agenda/{id}:
    get:
      operationId: getAgendaItem
      tags: [agenda]
      summary: Get an agenda item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaItem"
    patch:
      operationId: updateAgendaItem
      tags: [agenda]
      summary: Update an agenda item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaItemUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaItem"
    delete:
      operationId: deleteAgendaItem
      tags: [agenda]
      summary: Delete an agenda item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── CHAT MESSAGES (Unified Inbox) ─────────────────────────────────────────────
  /task-personali:
    get:
      operationId: listTaskPersonali
      tags: [task]
      summary: List personal tasks separated from agenda events
      parameters:
        - name: stato
          in: query
          schema:
            type: string
        - name: priorita
          in: query
          schema:
            type: string
        - name: contatto_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskPersonale"
    post:
      operationId: createTaskPersonale
      tags: [task]
      summary: Create a personal task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPersonaleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPersonale"

  /task-personali/{id}:
    get:
      operationId: getTaskPersonale
      tags: [task]
      summary: Get a personal task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
