components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── UTENTE ────────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [id, nome, ruolo, email, stato]
      properties:
        id:
          type: string
        nome:
          type: string
        ruolo:
          type: string
          enum: [admin, manager, staff]
        email:
          type: string
          format: email
        stato:
          type: string
          enum: [attivo, disattivato]

    AuthLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        remember:
          type: boolean
          default: false

    AuthSession:
      type: object
      required: [token, expires_at, utente]
      properties:
        token:
          type: string
        expires_at:
          type: string
        utente:
          $ref: "#/components/schemas/AuthUser"

    AuthLogoutResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    BootstrapAdminInput:
      type: object
      required: [nome, email, password]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        bootstrap_token:
          type: string
          description: Required when users already exist and ZAK_BOOTSTRAP_ADMIN_TOKEN is configured.

    Utente:
      type: object
      required: [id, nome, ruolo, email, stato, data_creazione]
      properties:
        id:
          type: string
        nome:
          type: string
        ruolo:
          type: string
          enum: [admin, manager, staff]
        email:
          type: string
          format: email
        stato:
          type: string
          enum: [attivo, disattivato]
          description: Stato operativo account staff. Gli account disattivati non devono poter accedere quando verra implementata l'autenticazione.
        data_creazione:
          type: string

    UtenteInput:
      type: object
      required: [nome, ruolo, email]
      properties:
        nome:
          type: string
        ruolo:
          type: string
          enum: [admin, manager, staff]
        email:
          type: string
          format: email
        stato:
          type: string
          enum: [attivo, disattivato]
          default: attivo
        password:
          type: string
          minLength: 8
          description: Optional initial password. Never returned by the API.

    UtenteUpdate:
      type: object
      properties:
        nome:
          type: string
        ruolo:
          type: string
          enum: [admin, manager, staff]
        email:
          type: string
          format: email
